name: Compilar app Android (companion)

on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/build-companion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-companion
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ubuntu-latest ya trae el Android SDK (ANDROID_HOME) con las licencias aceptadas.
      - name: Comprobar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Combinación probada: Gradle 8.9 + Android Gradle Plugin 8.7.3 + Kotlin 2.0.21
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p companion assembleDebug --stacktrace --no-daemon

      - name: Preparar APK
        run: cp companion/app/build/outputs/apk/debug/app-debug.apk mando-musica-dev.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mando-musica-dev-apk
          path: mando-musica-dev.apk

      - name: Publicar en Releases (etiqueta dev)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev mando-musica-dev.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Dev $(date -u +'%Y-%m-%d %H:%M') UTC" \
            --notes "APK de desarrollo generado desde ${GITHUB_SHA::7}. Se instala encima del anterior."
